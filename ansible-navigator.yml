---
ansible-navigator:
  ansible:
    config:
      help: false
    inventory:
      entries:
        - ./dutch_hosts
      help: false
    playbook:
      help: false
  editor:
    command: vi +{line_number} {filename}
    console: true
  execution-environment:
    container-engine: podman
    enabled: true
    image: aap.lab.example.com/ee-au457-rhel9
    # aap.lab.example.com/ee-supported-rhel9:latest
    pull:
      policy: missing
  format: yaml
  logging:
    append: true
    file: /home/student/cmc/ansible-navigator.log
    level: warning
  mode: stdout
  playbook-artifact:
    enable: false
    save-as: '{playbook_dir}/{playbook_name}-artifact-{time_stamp}.json'
