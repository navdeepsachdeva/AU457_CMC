- name: Forks and Serial Demo CI/CD
  hosts: all
  gather_facts: false
  order: reverse_sorted
  ## inventory / reverse_inventory/ sorted/ reverse_sorted/ shuffle
  serial:
    - 1
    # - 10%
    - 30%
    - 50%
    - 100%
  # serial: 7
  max_fail_percentage: 35
  vars:
    bad_systems:
      - aap.lab.example.com
      - iosxe2.lab.example.com
  tasks:

  - name: is database OK
    ansible.builtin.command: sleep 2
    run_once: true

  - name: Take down device from LB
    ansible.builtin.command: sleep 2

  - name: Update OS
    ansible.builtin.command: sleep 2
    failed_when: inventory_hostname in bad_systems

  - name: Update other Config
    ansible.builtin.command: sleep 2

  - name: Put device back to LB
    ansible.builtin.command: sleep 2

