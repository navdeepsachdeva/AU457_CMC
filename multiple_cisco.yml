- name: CISCO IOSXE1 to Playbook
  hosts: iosxe1*
  gather_facts: false
  remote_user: student
  become_method: enable

  tasks:
    # '-' is List / Array
    - name: Change GE1 Description
      cisco.ios.ios_interfaces:
        config:
          - name: GigabitEthernet1
            description: "GE1 Hello Day 2"

    - name: Configure the login banner
      cisco.ios.ios_banner:
        banner: motd
        text: "Hello Day2 - B"
        state: present

- name: CISCO IOSXE2 to Playbook
  hosts: iosxe2*
  gather_facts: false
  tasks:
    - name: Change GE1 Description
      cisco.ios.ios_interfaces:
        config:
          - name: GigabitEthernet1
            description: "GE1 Hello Day 2"

    - name: Configure the login banner
      cisco.ios.ios_banner:
        banner: motd
        text: "Hello Day2 - B"
        state: present

- name: Convert Ad-Hoc to Playbook
  hosts: aap*
  gather_facts: false
  remote_user: devops
  become: false
  # vars:
  #   ansible_user: devops

  tasks:
    - name: Install Software vsftpd
      become: true
      ansible.builtin.dnf:
        name: vsftpd
        state: present

    - name: Create a File in /tmp
      ansible.builtin.copy:
        dest: /tmp/f1
        content: "Hello CMC2"

- name: Juniper Play
  hosts: junos1*
  gather_facts: false
  tasks:
    - name: Load switchport configuration
      juniper.device.config:
        load: set
        lines:
          - 'set interfaces ge-0/0/1 description "Web-Server-Rack12"'
          - 'set interfaces ge-0/0/1 unit 0 family ethernet-switching interface-mode trunk'
          - 'set interfaces ge-0/0/1 unit 0 family ethernet-switching vlan members servers'
          - 'set interfaces ge-0/0/1 unit 0 family ethernet-switching vlan members database'
          - 'set interfaces ge-0/0/1 unit 0 family ethernet-switching vlan members management'
          - 'set interfaces ge-0/0/2 description "DB-Server-Rack12"'
          - 'set interfaces ge-0/0/2 unit 0 family ethernet-switching interface-mode trunk'
          - 'set interfaces ge-0/0/2 unit 0 family ethernet-switching vlan members database'
          - 'set interfaces ge-0/0/2 unit 0 family ethernet-switching vlan members backup'
        commit: true
        diff: true
        comment: "Provisioning server trunk ports"
    - name: Get interface configuration
      juniper.device.config:
        retrieve: 'committed'
        filter: "interfaces/interface"
        options:
          format: text
