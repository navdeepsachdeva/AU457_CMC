- name: Dependency Task with register Playbook
  hosts: iosxe1*
  gather_facts: false
  tasks:
    - name: Change GE1 Description
      cisco.ios.ios_interfaces:
        config:
          - name: GigabitEthernet1
            description: "GE1 Hello"
      register: captured

    # - name: Change GE2 Description
    #   cisco.ios.ios_interfaces:
    #     config:
    #       - name: GigabitEthernet2
    #         description: "GE2 Hello Hello"

    - name: Configure the login banner
      cisco.ios.ios_banner:
        banner: motd
        text: "Hello Day1 - L"
        state: present
      when: captured.changed
